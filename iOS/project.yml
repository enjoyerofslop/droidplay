# DroidPlay for iPhone and iPad: a launcher for the games DroidPlay installs. It lists the Mac's games and asks the Mac to build and
# install one; iOS doesn't let one app install another. Built and installed from the Mac: bin/install-ios <UDID>.
name: NXPlayIOS
options:
  deploymentTarget:
    iOS: "26.0"  # the games' own minimum (nxnative's dm/ios/project.yml)
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NXPlayIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # DroidPlay's own icon (Icon Composer, shared with the Mac app); Xcode compiles it into the asset catalog
      - path: ../App/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: DroidPlay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: DroidPlay finds your Mac on the local network to list your games and install them on this device.
        NSBonjourServices:
          - _nxplay._tcp
        # plain HTTP to <mac>.local: the pairing code guards it, and it never leaves the local network
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        # the team in the ID, as nxnative's games do: a Personal Team can't take an ID someone else registered
        PRODUCT_BUNDLE_IDENTIFIER: io.github.enjoyerofslop.droidplay.ios.$(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
